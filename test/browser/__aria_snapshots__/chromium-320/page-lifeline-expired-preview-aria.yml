- main "Lifeline":
  - heading "Lifeline" [level=1]
  - paragraph: Review incidents, preview bounded repairs, and execute deliberate remediation with recorded evidence.
  - text: "Lifeline health: Needs review"
  - region "Lifeline summary":
    - article:
      - paragraph: Needs Review
      - strong: "1"
    - article:
      - paragraph: Healthy Executors
      - strong: "1"
    - article:
      - paragraph: Pending Repair Previews
      - strong: "1"
    - article:
      - paragraph: Archived Repairs
      - strong: "1"
  - navigation "Incident views":
    - button "Needs Review"
    - button "Resolved"
  - table "Needs Review 1 incidents":
    - caption: Needs Review 1 incidents
    - rowgroup:
      - row "Incident Status Affected scope Actions":
        - columnheader "Incident"
        - columnheader "Status"
        - columnheader "Affected scope"
        - columnheader "Actions"
    - rowgroup:
      - 'row "Review incident Executor executor-alpha missed its heartbeat Lifeline incident status: Needs review 1 bounded record Preview remediation"':
        - cell "Review incident Executor executor-alpha missed its heartbeat":
          - button "Review incident Executor executor-alpha missed its heartbeat": Review incident
        - 'cell "Lifeline incident status: Needs review"'
        - cell "1 bounded record"
        - cell "Preview remediation":
          - button "Preview remediation"
  - region "Executor executor-alpha":
    - heading "Executor executor-alpha" [level=2]
    - paragraph: Active incidents keep preview, reason, and audit evidence close to the affected resource.
    - paragraph:
      - strong: Open the forensic bundle.
      - text: Inspection only.
    - paragraph:
      - strong: "Detection basis:"
      - text: Incident evidence
    - paragraph:
      - strong: "Affected records:"
      - text: No raw records available.
    - link "Open forensic timeline":
      - /url: /ops/jobs/forensics?incident_fingerprint=fixture-page-lifeline-expired-preview&view=active
    - region "Runbook continuity":
      - heading "Runbook continuity" [level=3]
      - paragraph:
        - strong: "Diagnosis:"
        - text: No remediation attempts recorded yet
      - paragraph:
        - strong: "Legal next path:"
        - text: Review current evidence
      - paragraph:
        - strong: "Venue:"
        - text: Powertools-native Lifeline
      - paragraph:
        - strong: "Attempt state:"
        - text: No attempt recorded
      - paragraph:
        - strong: "host-owned follow-up status:"
        - text: Host-owned follow-up unavailable
      - paragraph: No host escalation hook configured
      - paragraph:
        - strong: "Evidence link:"
        - text: Open forensic evidence
      - paragraph:
        - strong: "Audit follow-up:"
        - text: No audit follow-up available
      - paragraph: Powertools-native
      - paragraph: Oban Web bridge
      - paragraph: host-owned follow-up
    - paragraph: No remediation attempts recorded yet. This diagnosis has not entered a supported native remediation flow. Review legal next paths, then start a native preview to capture attempt context.
  - dialog "Confirm Lifeline repair":
    - paragraph: Executor executor-alpha
    - heading "Confirm Lifeline repair" [level=2]
    - region "Scope":
      - heading "Scope" [level=3]
      - paragraph: Executor executor-alpha
    - region "Consequence":
      - heading "Consequence" [level=3]
      - paragraph: Powertools applies only the reviewed bounded change. The repair is not atomic or exactly once, and execution does not prove downstream recovery.
    - region "Reversibility":
      - heading "Reversibility" [level=3]
      - paragraph: Accepted changes may not be reversible; changed targets are reported.
    - region "Support boundary":
      - heading "Support boundary" [level=3]
      - paragraph: Execution is per target and non-atomic.
    - region "This preview expired. Create a new preview before continuing.":
      - heading "This preview expired. Create a new preview before continuing." [level=3]
      - button "Create new preview"
      - button "Keep current state"
  - region "Retained support evidence":
    - heading "Healthy Executors" [level=2]
    - list:
      - listitem:
        - strong: executor-alpha
        - text: "Lifeline health: Healthy"
    - heading "Archive Activity" [level=2]
    - text: "Lifeline incident status: Resolved"
    - paragraph: Latest bounded archive activity retained.
    - paragraph: Archive and prune visibility is read-only here. Retention policy editing stays out of scope for this phase.