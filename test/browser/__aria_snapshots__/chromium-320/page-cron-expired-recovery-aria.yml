- region "Cron":
  - heading "Cron" [level=1]
  - paragraph: Review schedules, inspect one cron entry, and take deliberate action with recorded evidence.
  - table "Cron entries 2 cron entries":
    - caption: Cron entries 2 cron entries
    - rowgroup:
      - row "Entry Schedule Policies/support State":
        - columnheader "Entry"
        - columnheader "Schedule"
        - columnheader "Policies/support"
        - columnheader "State"
    - rowgroup:
      - 'row "nightly-notification-reconciliation 0 2 * * * Etc/UTC Queue One Latest Only Code Cron status: Runnable"':
        - cell "nightly-notification-reconciliation":
          - link "nightly-notification-reconciliation":
            - /url: /ops/jobs/cron?entry=nightly-notification-reconciliation
        - cell "0 2 * * * Etc/UTC"
        - cell "Queue One Latest Only Code"
        - 'cell "Cron status: Runnable"'
      - 'row "paused-notification-reconciliation 0 2 * * * Etc/UTC Queue One Latest Only Code Cron status: Waiting"':
        - cell "paused-notification-reconciliation":
          - link "paused-notification-reconciliation":
            - /url: /ops/jobs/cron?entry=paused-notification-reconciliation
        - cell "0 2 * * * Etc/UTC"
        - cell "Queue One Latest Only Code"
        - 'cell "Cron status: Waiting"'
  - dialog "Pause nightly-notification-reconciliation":
    - paragraph: nightly-notification-reconciliation
    - heading "Pause nightly-notification-reconciliation" [level=2]
    - region "Scope":
      - heading "Scope" [level=3]
      - paragraph: Cron entry nightly-notification-reconciliation
    - region "Consequence":
      - heading "Consequence" [level=3]
      - paragraph: Future schedule claims stop. Work that is already running or enqueued is unaffected.
    - region "Reversibility":
      - heading "Reversibility" [level=3]
      - paragraph: Resume the cron entry later to allow future schedule claims again.
    - region "Support boundary":
      - heading "Support boundary" [level=3]
      - paragraph: The existing schedule and already-claimed work remain unchanged.
      - paragraph: "Actor: ops-demo"
      - paragraph: One immutable operator event will be written. Powertools-native surfaces keep diagnosis, preview, reason, and audited action together.
      - paragraph: "Reason draft: Planned provider maintenance."
      - paragraph: This preview expired.
    - region "This preview expired. Create a new preview before continuing.":
      - heading "This preview expired. Create a new preview before continuing." [level=3]
      - button "Create new preview"
      - button "Keep running"