- main:
  - heading "Batches" [level=1]
  - paragraph: Review batch and chain progress, understand blocked work, and follow Lifeline-routed recovery with recorded evidence.
  - region "Batch summary":
    - article:
      - term: Total Batches
      - definition: "20"
    - article:
      - term: Needs Attention
      - definition: "6"
    - article:
      - term: Executing
      - definition: "14"
    - article:
      - term: Completed
      - definition: "0"
  - navigation "Batch status":
    - button "All (20)"
    - button "Executing (14)"
    - button "Completed (0)"
    - button "Failed (6)"
    - button "Cancelled (0)"
  - text: Batch name or ID
  - textbox "Batch name or ID":
    - /placeholder: All batches
  - text: Queue
  - textbox "Queue":
    - /placeholder: All queues
  - text: Worker
  - textbox "Worker":
    - /placeholder: All workers
  - checkbox "Chain only"
  - text: Chain only
  - table "Current batches 20 batches Page 2; up to 20 batches per page.":
