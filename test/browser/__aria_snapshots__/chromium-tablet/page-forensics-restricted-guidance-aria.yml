    - term: Subject
    - definition: Limiter restricted-guidance
    - term: Evidence type
    - definition: Limiter
    - term: Ownership
    - definition: Powertools-native retained evidence
    - term: Current diagnosis
    - definition: Blocked
    - term: Detail
    - definition: Current evidence is visible while follow-up destinations remain restricted.
    - term: Provenance
    - definition: Durable evidence
    - term: Completeness
    - definition: Complete
    - term: Coverage
    - definition: Showing all 2 available events in this source window.
