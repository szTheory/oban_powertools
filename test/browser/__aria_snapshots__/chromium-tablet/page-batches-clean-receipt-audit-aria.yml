- main:
  - heading "Batches" [level=1]
  - paragraph: Review batch and chain progress, understand blocked work, and follow Lifeline-routed recovery with recorded evidence.
  - status: Retry request recorded in Audit.
  - region "Batch summary":
    - article:
      - term: Total Batches
      - definition: "1"
    - article:
      - term: Needs Attention
      - definition: "0"
    - article:
      - term: Executing
      - definition: "1"
    - article:
      - term: Completed
      - definition: "0"
  - navigation "Batch status":
    - button "All (1)"
    - button "Executing (1)"
    - button "Completed (0)"
    - button "Failed (0)"
    - button "Cancelled (0)"
  - text: Batch name or ID
  - textbox "Batch name or ID":
    - /placeholder: All batches
  - text: Queue
  - textbox "Queue":
    - /placeholder: All queues
  - text: Worker
  - textbox "Worker":
    - /placeholder: All workers
  - checkbox "Chain only"
  - text: Chain only
  - table "Current batches 1 batches Page 1; up to 20 batches per page.":
    - caption: Current batches 1 batches Page 1; up to 20 batches per page.
    - rowgroup:
      - row "Batch Operator status Progress Failed Callbacks Updated Actions":
        - columnheader "Batch"
        - columnheader "Operator status"
        - columnheader "Progress"
        - columnheader "Failed"
        - columnheader "Callbacks"
        - columnheader "Updated"
        - columnheader "Actions"
    - rowgroup:
      - 'row "לקוחות مرحبا notification batch batch-001 Batch status: Executing Running Progress for לקוחות مرحبا notification batch 7500 7500/10000 75% 0 failed 0 retryable Pending 0 Failed 0 Claimed 0 Delivered 7500 2026-07-19T14:05:00Z Open batch"':
        - cell "לקוחות مرحبا notification batch batch-001":
          - strong: לקוחות مرحبا notification batch
          - text: batch-001
        - 'cell "Batch status: Executing Running"'
        - cell "Progress for לקוחות مرحبا notification batch 7500 7500/10000 75%":
          - text: Progress for לקוחות مرحبا notification batch
          - progressbar "Progress for לקוחות مرحبا notification batch": "7500"
          - text: 7500/10000 75%
        - cell "0 failed 0 retryable"
        - cell "Pending 0 Failed 0 Claimed 0 Delivered 7500"
        - cell "2026-07-19T14:05:00Z"
        - cell "Open batch":
          - link "Open batch":
            - /url: /ops/jobs/batches/batch-001
  - navigation "Batch pages":
    - button "Previous" [disabled]
    - button "Next" [disabled]