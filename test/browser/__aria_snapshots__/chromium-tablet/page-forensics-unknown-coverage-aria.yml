    - definition: Workflow unknown-coverage
    - term: Evidence type
    - definition: Workflow
    - term: Ownership
    - definition: Powertools-native retained evidence
    - term: Current diagnosis
    - definition: Waiting
    - term: Detail
    - definition: Current evidence is retained, but complete source coverage cannot be established.
    - term: Provenance
    - definition: Durable evidence
    - term: Completeness
    - definition: Unknown
    - term: Coverage
    - definition: Total availability is unknown.
