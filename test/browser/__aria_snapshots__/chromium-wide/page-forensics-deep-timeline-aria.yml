- main:
  - heading "Forensics" [level=1]
  - paragraph: Inspect a supported evidence scope, review the current diagnosis, and follow the retained record.
  - region "Read-only evidence":
    - heading "Read-only evidence" [level=2]
    - paragraph: Forensics summarizes retained Powertools evidence and does not prove root cause.
  - region "Filters":
    - text: Evidence type Required
    - combobox "Evidence type Required":
      - option "Choose evidence type"
      - option "Workflow" [selected]
      - option "Lifeline incident"
      - option "Cron entry"
      - option "Limiter"
    - text: Workflow ID Required
    - textbox "Workflow ID Required": wf-nightly
    - paragraph: Enter the stable workflow identifier.
    - text: Step
    - textbox "Step": deliver
    - paragraph: Optional workflow step name.
    - button "Inspect evidence"
    - status: Choose one supported evidence scope.
  - region "Investigation summary":
    - heading "Investigation summary" [level=2]
    - term: Subject
    - definition: Workflow deep-history
    - term: Evidence type
    - definition: Workflow
    - term: Ownership
    - definition: Powertools-native retained evidence
    - term: Current diagnosis
    - definition: Waiting
    - term: Detail
    - definition: The newest retained evidence is shown in a bounded timeline.
    - term: Provenance
    - definition: Durable evidence
    - term: Completeness
    - definition: Partial evidence
    - term: Coverage
    - definition: Showing the newest 50 of 80 retained events.
  - region "What to do next":
    - heading "What to do next" [level=2]
    - paragraph: No authorized follow-up destination is available for this evidence.
